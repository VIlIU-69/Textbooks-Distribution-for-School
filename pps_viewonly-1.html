html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}

.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,#17389c,#2b6cf0);color:#fff;border:0;display:flex;align-items:center;gap:14px}
.hero .sub{color:#d5e0ff}
.ring{position:relative;width:104px;height:104px;flex:none}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}

.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{cursor:pointer}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.t-done{background:#12a36a22;color:var(--ok)}.t-part{background:#1f4fd822;color:var(--pri)}.t-none{background:#d6454522;color:var(--bad)}.t-short{background:#e08a0022;color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin:4px 0 10px}
label{font-size:12px;color:var(--mut);font-weight:600}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-size:16px;font-weight:600}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--line);margin-top:8px}
.step{display:flex;gap:8px;margin:-2px 0 12px}.step button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:9px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:600}.seg .on{background:var(--card);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#131a2b;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}
.nums{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}.nums b{color:var(--tx)}
.warn{color:var(--warn);font-size:13px;margin:-4px 0 10px}

body{font-size:18px;padding-bottom:110px}
main{max-width:none;width:100%;padding:18px}
h1{font-size:27px}h2{font-size:21px;margin:22px 0 10px}
.sub{font-size:16px}
.card{padding:18px;border-radius:18px}
.hero div[style*="font-size:24px"]{font-size:32px!important}
.ring{width:124px;height:124px}.ring svg{width:124px;height:124px}.ring b{font-size:27px}
.kpi{padding:16px}.kpi small{font-size:16px}.kpi b{font-size:32px}
.bar{height:11px}
.tag{font-size:14px;padding:5px 11px}
.chip{font-size:18px;padding:11px 18px}
input,select{font-size:19px;padding:15px;border-radius:14px}
label{font-size:16px}
.btn{font-size:20px;padding:17px}
.step button{font-size:19px;padding:13px}
.seg button{font-size:17px;padding:12px}
nav button{font-size:14px;padding:8px 0}nav button span{font-size:26px}
.toast{font-size:18px;bottom:110px}
.nums{font-size:16px;gap:14px}
.warn{font-size:17px}
@media(min-width:800px){main{padding:28px 6vw}.grid{grid-template-columns:repeat(4,1fr)}body{font-size:19px}}

const MODE='view';
const KEY='pps_rows_1c17bc0e';

if(!Array.isArray(rows)||!rows.length)rows=D.map(r=>r.slice());

let DL=null;try{window.claude&&claude.use('downloads').then(d=>{DL=d;if(S.tab=='home')render()},()=>{})}catch(e){}
const S={tab:'home',cls:null,q:'',sel:null,mode:'upd',reset:false};

const pct=(a,b)=>b?Math.round(a/b*100):0;
const stock=x=>Math.max(x[3]-x[4],0), short=x=>Math.max(x[2]-x[3],0);

function render(){if(!ADMIN&&S.tab=='upd')S.tab='home';$('#app').innerHTML={home,cls,bks,upd}[S.tab]();

if(S.tab=='upd'&&S.mode=='new')$('#ad').onclick=()=>{const c=$('#nc').value.trim(),b=$('#nb').value.trim(),e=+$('#ne').value||0,r=+$('#nr').value||0,d=+$('#nd').value||0;

if(rows.some(x=>x[0]==c&&x[1]==b)){toast('That item already exists');return}
rows.push([c,b,e,r,d]);save();S.sel=rows.length-1;S.mode='upd';toast('Item added');render()}}

function grp(i){const m={};rows.forEach(r=>{(m[r[i]]=m[r[i]]||[]).push(r)});return Object.keys(m).map(k=>{const a=agg(m[k]);return[k,a.e,a.r,a.sh,a.d,a.s,{t:'n',v:a.r?a.d/a.r:0,z:'0%'},{t:'n',v:a.e?a.r/a.e:0,z:'0%'}]})}
function mkWb(){const P=(v)=>({t:'n',v:v,z:'0%'});
const H=['Class','Book','Expected','Received','Distributed','Stock Remaining','Distribution %','Receipt %','Shortfall'];
const inv=[H];rows.forEach((x,i)=>{const n=i+2;inv.push([x[0],x[1],x[2],x[3],x[4],{t:'n',v:stock(x),f:`MAX(D${n}-E${n},0)`},{t:'n',v:x[3]?x[4]/x[3]:0,f:`IF(D${n}=0,0,E${n}/D${n})`,z:'0%'},{t:'n',v:x[2]?x[3]/x[2]:0,f:`IF(C${n}=0,0,D${n}/C${n})`,z:'0%'},{t:'n',v:short(x),f:`MAX(C${n}-D${n},0)`}])});
const t=agg(rows);const G=['Name','Expected','Received','Shortfall','Distributed','Stock Remaining','Distribution %','Receipt %'];
const sum=[['BOOK SUPPLY & DISTRIBUTION SUMMARY'],[],['Total Expected','Total Received','Total Distributed','Stock Remaining','Distribution %'],[t.e,t.r,t.d,t.s,P(t.r?t.d/t.r:0)],[],['Class'].concat(G.slice(1)),...grp(0),['TOTAL',t.e,t.r,t.sh,t.d,t.s,P(t.r?t.d/t.r:0),P(t.e?t.r/t.e:0)]];
const wb=XLSX.utils.book_new();
[['Summary',sum,[16,12,12,12,12,16,15,12]],['Inventory',inv,[8,28,10,10,12,16,15,12,10]],['Book Summary',[['Book'].concat(G.slice(1)),...grp(1)],[28,10,10,10,12,16,15,12]]].forEach(s=>{const ws=XLSX.utils.aoa_to_sheet(s[1]);ws['!cols']=s[2].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,s[0])});
return wb}
async function exportX(){if(typeof XLSX==='undefined'){toast('Excel tool did not load');return}
try{const buf=XLSX.write(mkWb(),{type:'array',bookType:'xlsx'});await DL.save({filename:'PPS_Book_Distribution_'+new Date().toISOString().slice(0,10)+'.xlsx',data:buf});toast('Excel file saved')}catch(e){if(e&&e.code=='declined')return;toast('Could not save the file')}}
function copyRep(){const t=agg(rows);let s=`BOOK SUPPLY & DISTRIBUTION SUMMARY\nExpected ${t.e} | Received ${t.r} | Distributed ${t.d} | Stock ${t.s} | ${pct(t.d,t.r)}% distributed\n\nBy class:\n`;
classes().forEach(c=>{const a=agg(rows.filter(r=>r[0]==c));s+=`${c}: exp ${a.e}, rec ${a.r}, given ${a.d}, stock ${a.s}, ${pct(a.d,a.r)}%\n`});
const ng=rows.filter(x=>x[4]==0);s+=`\nNot yet distributed (${ng.length}): `+ng.map(x=>x[0]+' '+x[1]).join('; ');
const sh=rows.filter(x=>short(x)>0);s+=`\n\nShortfalls: `+(sh.map(x=>`${x[0]} ${x[1]} (${short(x)})`).join('; ')||'none');
const done=()=>toast('Report copied');
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(done,fb);else fb();
function fb(){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Copy not supported')}a.remove()}}
render();
</script></body></html>
